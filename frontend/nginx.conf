server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Serwlety backendu (Tomcat) – ta sama domena, więc sesja/ciasteczko działa bez CORS
    location ~ ^/(logowanie|ksiazki|wyloguj)$ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pliki z hashem w nazwie (vite build) można długo cache'ować
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Aplikacja React (SPA) – nieznane ścieżki wracają do index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
