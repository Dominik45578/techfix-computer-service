services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ti-backend
    env_file:
      - path: .env
        required: false
    volumes:
      - sqlite-data:/usr/local/tomcat/data
    networks:
      - backend-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ti-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    networks:
      - frontend-net
      - backend-net
    restart: unless-stopped

networks:
  frontend-net:
  backend-net:
    internal: true

volumes:
  sqlite-data:
