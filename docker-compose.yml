services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ti-backend
    env_file:
      - path: .env
        required: false
    volumes:
      - sqlite-data:/usr/local/tomcat/data
    networks:
      - backend-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ti-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    networks:
      - frontend-net
      - backend-net
    restart: unless-stopped

  # Podgląd bazy SQLite w przeglądarce (tylko do odczytu).
  # Uruchomienie: docker compose --profile tools up -d sqlite-web
  sqlite-web:
    image: ghcr.io/coleifer/sqlite-web:latest
    container_name: ti-sqlite-web
    profiles: ["tools"]
    environment:
      SQLITE_DATABASE: serwis/serwis.db
    volumes:
      - sqlite-data:/data:ro
    ports:
      - "127.0.0.1:${SQLITE_WEB_PORT:-8091}:8080"
    restart: unless-stopped

networks:
  frontend-net:
  backend-net:
    internal: true

volumes:
  sqlite-data:
